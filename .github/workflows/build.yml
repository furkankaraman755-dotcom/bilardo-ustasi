name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android lisanslari
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Web dosyalarini hazirla
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Capacitor kur
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Yatay ekran kilidi
        run: |
          sed -i 's/MainActivity"/MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Tam ekran
        run: |
          cp native/MainActivity.java android/app/src/main/java/com/bilardoustasi/oyun/MainActivity.java
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#' android/app/src/main/res/values/styles.xml
          cat android/app/src/main/res/values/styles.xml

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK adini duzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BilardoUstasi.apk

      - uses: actions/upload-artifact@v5
        with:
          name: bilardo-ustasi-apk
          path: BilardoUstasi.apk

      - name: Indirme sayfasina koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Bilardo Ustasi surum ${{ github.run_number }}
          make_latest: true
          files: BilardoUstasi.apk
