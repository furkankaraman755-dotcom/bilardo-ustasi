name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Web dosyalarini hazirla
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Capacitor kur
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Dikey ekran kilidi
        run: |
          sed -i 's/MainActivity"/MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bilardo-ustasi-apk
          path: android/app/build/outputs/apk/debug/*.apk
