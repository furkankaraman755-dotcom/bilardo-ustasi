/* ================= ROYAL CLASSIC TASARIM DİLİ ================= */
:root{--rc-gold:#c9a24e;--rc-gold2:#f0d78c;--rc-gold3:#8a6a2a;--rc-wood:#24103e;--rc-wood2:#0b0414;--rc-text:#f2ecff;--rc-font:Roboto,'Segoe UI',system-ui,Arial,sans-serif}
html,body{background:#0b0414!important;color:var(--rc-text)!important;font-family:var(--rc-font)!important}
button{font-family:var(--rc-font)}
#menu,.lscr,#shop,#login,#game{background:
  radial-gradient(ellipse 28% 24% at 22% 0%,rgba(170,90,255,.22),transparent 70%),
  radial-gradient(ellipse 28% 24% at 78% 0%,rgba(170,90,255,.22),transparent 70%),
  radial-gradient(ellipse 70% 40% at 50% 112%,rgba(120,50,220,.38),transparent 70%),
  linear-gradient(180deg,transparent 63%,rgba(201,162,78,.28) 63.2%,transparent 63.8%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 2px,rgba(255,255,255,.018) 2px 3px,transparent 3px 160px),
  linear-gradient(180deg,#1a0a2e 0%,#12061f 58%,#07030d 100%)!important}
/* çerçeve: deri + ince altın işleme */
.prof,.tb,.cur,.ib,.slot,.room,.item,.pk,.lrow,.day,.mis,.coins,.htabs button,.top .back,.hdr .back,#sback,.cr,.fr,.dlist .mis,
#game .pname,#game .brow,#game .stake,#emoBtn,#likeBtn,.cueb,#toast,#emoBar,#giftBar,.vspot,#mmScr .mmPot{
  background:linear-gradient(180deg,#2a1048,#0e0619)!important;border:1px solid var(--rc-gold)!important;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.75),inset 0 0 0 3px rgba(201,162,78,.22),0 3px 8px rgba(0,0,0,.55)!important;color:var(--rc-text)}
button:not(.gold):not(.tile):not(.hm):not(.dbtn){background:linear-gradient(180deg,#3a1a5e,#1a0a30);border:1px solid rgba(201,162,78,.7);color:var(--rc-text)}
.gold,button.gold{background:linear-gradient(180deg,#f6e3a8,#c9a24e 55%,#8a6a2a)!important;color:#2a1a08!important;border:1px solid #f6e3a8!important;text-shadow:0 1px 0 rgba(255,255,255,.35);font-weight:800}
.htabs button.on{background:linear-gradient(180deg,#f6e3a8,#c9a24e)!important;color:#2a1a08!important}
h2,h3,.mtitle,.tile b,.hdr h2,.top h2,#over h2{font-family:var(--rc-font)!important;color:var(--rc-gold2)}
.stats,.sm{color:#b9a9d6!important}
/* ana ekran */
.mtitle{background:linear-gradient(#fff3c8,#c9a24e 60%,#8a6a2a);-webkit-background-clip:text;background-clip:text;color:transparent!important;letter-spacing:2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}

  box-shadow:inset 0 0 0 4px #120722,inset 0 0 0 5px rgba(201,162,78,.45),0 6px 16px rgba(0,0,0,.6)!important;position:relative}

/* ================= FİZİK ================= */
function pot(b){if(b.pot)return;b.pot=true;b.vx=b.vy=0;shotPotted.push(b.id);if(b.id)potOrder.push(b.id);snd(12,180,.18);startSink(b);}
// güç eğrisi: az çekiş yumuşak/kısa, çok çekiş sert/uzun
const GEXP=1.15,pw2v=p=>MAXV*Math.pow(Math.max(0,p)/100,GEXP),v2pw=v=>100*Math.pow(Math.min(1,Math.max(0,v)/MAXV),1/GEXP);
// çuha sürtünmesi: sabit yuvarlanma direnci + hızla artan kısım (yavaş top yumuşak durur)
// yuvarlanma direnci (sabit, gerçek çuhaya yakın) + hafif hız sönümü: toplar akıcı ilerler, sonunda yumuşakça durur
const ROLL_RES=0.0065,LIN_DAMP=0.0045,STOP_V=0.05;
const decel=v=>Math.max(0,v-(ROLL_RES+v*LIN_DAMP));
// bant sekmesi: sert gelen top daha güçlü seker
const cushE=v=>Math.max(.74,Math.min(.9,.91-Math.abs(v)*.0075)); // gerçek bant: yavaş topta canlı, sert vuruşta daha çok enerji kaybı
let potOrder=[];
// falso: yan falso bant dönüşünü, üst/alt falso ilk çarpışmadan sonrasını etkiler
let inDir=null;
function side(b){inDir=b===cue&&shotSpin&&Math.abs(shotSpin.x)>.02?{x:b.vx,y:b.vy}:null;}
function cush(b){b.cush=(b.cush||0)+1;}
function sideKick(b){cush(b);
  if(!inDir)return;const sp=Math.hypot(inDir.x,inDir.y);if(sp<.05)return;
  const rx=-inDir.y/sp,ry=inDir.x/sp,k=shotSpin.x*sp*.32;
  b.vx+=rx*k;b.vy+=ry*k;shotSpin.x*=.45;inDir=null;
}
/* ---- top dönüşü (3B yön matrisi) ---- */
function rotBall(b,ax,ay,az,th){ // b.M = Döndür(eksen,açı) × b.M
  if(!th)return;const c=Math.cos(th),s=Math.sin(th),t=1-c;
  const r0=t*ax*ax+c,r1=t*ax*ay-s*az,r2=t*ax*az+s*ay,r3=t*ax*ay+s*az,r4=t*ay*ay+c,r5=t*ay*az-s*ax,r6=t*ax*az-s*ay,r7=t*ay*az+s*ax,r8=t*az*az+c;
  const M=b.M||(b.M=[1,0,0,0,1,0,0,0,1]);
  b.M=[r0*M[0]+r1*M[3]+r2*M[6],r0*M[1]+r1*M[4]+r2*M[7],r0*M[2]+r1*M[5]+r2*M[8],
       r3*M[0]+r4*M[3]+r5*M[6],r3*M[1]+r4*M[4]+r5*M[7],r3*M[2]+r4*M[5]+r5*M[8],
       r6*M[0]+r7*M[3]+r8*M[6],r6*M[1]+r7*M[4]+r8*M[7],r6*M[2]+r7*M[5]+r8*M[8]];
  b.rv=(b.rv||0)+1;
  if(b.rv%300===0){ // sayısal kaymayı düzelt
    const m=b.M;let n=Math.hypot(m[0],m[1],m[2]);m[0]/=n;m[1]/=n;m[2]/=n;
    let d=m[0]*m[3]+m[1]*m[4]+m[2]*m[5];m[3]-=d*m[0];m[4]-=d*m[1];m[5]-=d*m[2];n=Math.hypot(m[3],m[4],m[5]);m[3]/=n;m[4]/=n;m[5]/=n;
    m[6]=m[1]*m[5]-m[2]*m[4];m[7]=m[2]*m[3]-m[0]*m[5];m[8]=m[0]*m[4]-m[1]*m[3];}
}
function rollBall(b,dx,dy){const d=Math.hypot(dx,dy);if(d>1e-7)rotBall(b,-dy/d,dx/d,0,d/R);} // yuvarlanma: yol / yarıçap
// falso: ilk temasta takip/geri çekme ve yan kayma; top yolda ilerledikçe falso biraz azalır, etkisi kısa bir eğriyle uygulanır
function spinContact(cb,sp0){
  const s=shotSpin,kd=Math.max(.35,1-(s.dist||0)/1400),dx=s.dx,dy=s.dy;
  const f=-s.y*sp0*.62*kd,sd=s.x*sp0*.16*kd; // f>0 takip, f<0 geri çekme; sd>0 sağa, <0 sola
  if(Math.abs(f)+Math.abs(sd)<.01)return;
  cb.curve={vx:dx*f-dy*sd,vy:dy*f+dx*sd};s.x*=.7;
}
function physStep(f){
  if(shotSpin&&!shotSpin.used&&cue&&!cue.pot)shotSpin.dist=(shotSpin.dist||0)+Math.hypot(cue.vx,cue.vy)*f;
  if(cue&&cue.curve){if(cue.pot)cue.curve=null;else{const a=Math.min(1,f*.18),c=cue.curve;cue.vx+=c.vx*a;cue.vy+=c.vy*a;c.vx*=1-a;c.vy*=1-a;if(Math.abs(c.vx)+Math.abs(c.vy)<.01)cue.curve=null;}}
  for(const b of balls){if(b.pot)continue;b.x+=b.vx*f;b.y+=b.vy*f;rollBall(b,b.vx*f,b.vy*f);}
  for(const b of balls){
    if(b.pot)continue;
    for(const p of POCKETS){const rr=p.r-R*.2;if((b.x-p.x)**2+(b.y-p.y)**2<rr*rr){b.pk=POCKETS.indexOf(p);pot(b);break;}} // merkez dudağı geçince düşer
    if(b.pot)continue;
    if(b.x<CJ+R||b.x>TW-CJ-R||b.y<CJ+R||b.y>TH-CJ-R||Math.abs(b.x-TW/2)<SJ+R)for(const sg of CUSH)segHit(b,sg);
    else{ // düz bant (hızlı yol)
      if(b.x<R)segHit(b,CUSH[4]);else if(b.x>TW-R)segHit(b,CUSH[5]);
      if(b.y<R)segHit(b,b.x<TW/2?CUSH[0]:CUSH[1]);else if(b.y>TH-R)segHit(b,b.x<TW/2?CUSH[2]:CUSH[3]);}
    const pl=pocketPull(b);if(pl){b.vx+=pl.x*.02*f;b.vy+=pl.y*.02*f;}
    if(b.x<-3*R||b.x>TW+3*R||b.y<-3*R||b.y>TH+3*R)pot(b);
  }
  // top-top çarpışması: kümelerde (açış, yapışık toplar) iç içe geçme kalmasın diye 3 geçişe kadar çözülür
  for(let pass=0;pass<3;pass++){let hit=false;
  for(let i=0;i<balls.length;i++){const a=balls[i];if(a.pot)continue;
    for(let j=i+1;j<balls.length;j++){const b=balls[j];if(b.pot)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2<4*R*R-1e-6&&d2>1e-6){hit=true;
        const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*R-d)/2;
        a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
        if(rel>0){
          const cb=a===cue?a:b===cue?b:null,sp0=cb?Math.hypot(cb.vx,cb.vy):0;
          const j2=rel*.982;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny;
          // kesme atışında temas sürtünmesi: hedef top hafifçe kesme yönüne "fırlar" (gerçek bilardodaki throw, ~1-3°)
          const tx=-ny,ty=nx,vt=(a.vx-b.vx)*tx+(a.vy-b.vy)*ty,jt=Math.sign(vt)*Math.min(.055*j2,Math.abs(vt)/7);
          if(jt){a.vx-=jt*tx;a.vy-=jt*ty;b.vx+=jt*tx;b.vy+=jt*ty;}
          if(cb&&shotSpin&&!shotSpin.used){shotSpin.used=1;spinContact(cb,sp0);}
          if(firstHit===null){if(a.id===0)firstHit=b.id;else if(b.id===0)firstHit=a.id;}
          snd(rel,1900,.05);
        }
      }
    }
  }
  if(!hit)break;}
}
function friction(){
  let any=false;
  if(cue&&cue.sv&&!cue.pot){const sv=cue.sv,sp=Math.hypot(cue.vx,cue.vy),dx=sp>.05?cue.vx/sp:sv.dx,dy=sp>.05?cue.vy/sp:sv.dy;
    rotBall(cue,-dy,dx,0,sv.t);rotBall(cue,0,0,1,sv.s);sv.t*=.955;sv.s*=.97;if(Math.abs(sv.t)+Math.abs(sv.s)<.004)cue.sv=null;}
  for(const b of balls){if(b.pot)continue;
    const s=Math.hypot(b.vx,b.vy);
    if(s<STOP_V){if(pocketPull(b)||b.curve){any=true;continue;}b.vx=b.vy=0;continue;}
    const ns=decel(s);b.vx*=ns/s;b.vy*=ns/s;any=true;
  }
  return any;
}

  firstHit=null;shotPotted=[];ballInHand=false;moving=true;shots++;aiShowAim=false;for(const b of balls)b.cush=0;

function freeSpot(x,y){
  for(let r=0;r<400;r+=4)for(let a=0;a<6.28;a+=.5){
    const px=Math.min(TW-R,Math.max(R,x+Math.cos(a)*r)),py=Math.min(TH-R,Math.max(R,y+Math.sin(a)*r));
    if(balls.every(o=>o.pot||o===cue||Math.hypot(o.x-px,o.y-py)>2*R+1))return[px,py];
  }return[x,y];
}
function respawnCue(){cue.pot=false;cue.vx=cue.vy=0;[cue.x,cue.y]=freeSpot(TW*0.2,TH/2);}

function endShot9(p,s,potted,scratch){

function msDay(){
  if(save.ms&&save.ms.day===today())return save.ms;
  const pool=MISSIONS.slice(),ids=[];while(ids.length<3){const m=pool.splice(Math.random()*pool.length|0,1)[0];if(!ids.some(i=>MISSIONS.find(x=>x.id===i).ev===m.ev))ids.push(m.id);}
  save.ms={day:today(),ids,prog:{},done:{},bonus:false};persist();return save.ms;
}
function track(ev,n){
  n=n||1;const m=msDay();
  for(const id of m.ids){const d=MISSIONS.find(x=>x.id===id);if(d.ev===ev)m.prog[id]=Math.min(d.n,(m.prog[id]||0)+n);}
  if(ev==='pot')save.st.pots+=n;if(ev==='tour')save.st.tours+=n;if(ev==='wheel')save.st.spins+=n;if(ev==='scr')save.st.scr+=n;if(ev==='play')save.st.matches+=n;
  persist();extrasDots();
}
function openMissions(){
  const m=msDay();let h='<h2 style="margin:0 0 4px">📋 Günlük Görevler</h2><div class="stats">Her gün yenilenir · üçünü bitir, +5 💎 bonus al</div><div class="dlist" style="margin-top:8px">';
  for(const id of m.ids){const d=MISSIONS.find(x=>x.id===id),pr=m.prog[id]||0,ok=pr>=d.n,dn=m.done[id];
    h+=`<div class="mis"><div style="font-size:24px">${dn?'✅':ok?'🎁':'🎯'}</div><div class="t">${d.t}<div class="bar"><i style="width:${pr/d.n*100}%"></i></div><div class="stats" style="text-align:left">${pr}/${d.n}</div></div><div class="rw">${rwTxt(d.rw)}</div>
      <button ${ok&&!dn?'class="gold"':'disabled'} data-m="${id}">${dn?'Alındı':ok?'Al':'Devam'}</button></div>`;}
  const all=m.ids.every(i=>m.done[i]);
  h+=`<div class="mis"><div style="font-size:24px">💎</div><div class="t">Tüm görevler bonusu</div><div class="rw">5 💎</div><button ${all&&!m.bonus?'class="gold"':'disabled'} id="msB">${m.bonus?'Alındı':'Al'}</button></div>`;
  h+='</div><div id="msM" class="stats" style="min-height:16px"></div><button id="msX" style="min-width:140px;margin-top:6px">Kapat</button>';

const WHEEL=[{t:'250',rw:{coins:250},c:'#3c8dde',w:22},{t:'1 💵',rw:{cash:1},c:'#2fa84f',w:10},{t:'500',rw:{coins:500},c:'#9b5de5',w:20},{t:'3 💎',rw:{gems:3},c:'#00a8a8',w:8},
  {t:'1K',rw:{coins:1000},c:'#e2453c',w:16},{t:'100',rw:{coins:100},c:'#ff9800',w:14},{t:'2,5K',rw:{coins:2500},c:'#e91e63',w:7},{t:'10K',rw:{coins:10000},c:'#c9962e',w:3}];
const WHEEL_H=8;
const wheelFree=()=>Date.now()-(save.wheel||0)>=WHEEL_H*HOUR;
function drawWheel(cv,rot){
  const c=cv.getContext('2d'),S=cv.width,r=S/2-6,n=WHEEL.length;c.clearRect(0,0,S,S);c.save();c.translate(S/2,S/2);
  c.fillStyle='#e8c15a';c.beginPath();c.arc(0,0,r+5,0,7);c.fill();
  for(let i=0;i<n;i++){const a0=rot+i*2*Math.PI/n-Math.PI/2-Math.PI/n,a1=a0+2*Math.PI/n;
    c.fillStyle=WHEEL[i].c;c.beginPath();c.moveTo(0,0);c.arc(0,0,r,a0,a1);c.closePath();c.fill();c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;c.stroke();
    c.save();c.rotate((a0+a1)/2);c.fillStyle='#fff';c.font=`900 ${S*.07}px Arial`;c.textAlign='right';c.textBaseline='middle';c.fillText(WHEEL[i].t.replace(' 💵',''),r-(WHEEL[i].rw.coins||WHEEL[i].rw.cash?S*.1:10),0);if(WHEEL[i].rw.coins){const cr=S*.032;if(CHIP_IMG.complete)c.drawImage(CHIP_IMG,r-S*.06-cr,-cr,cr*2,cr*2);}else if(WHEEL[i].rw.cash&&window.CASH_IMG&&CASH_IMG.complete){const cr=S*.036;c.drawImage(CASH_IMG,r-S*.06-cr,-cr*.88,cr*2,cr*1.76);}c.restore();}
  c.fillStyle='#1a1208';c.beginPath();c.arc(0,0,r*.16,0,7);c.fill();c.fillStyle='#f0cf6a';c.font=`900 ${S*.08}px Arial`;c.textAlign='center';c.textBaseline='middle';c.fillText('★',0,1);
  c.restore();
  c.fillStyle='#fff';c.strokeStyle='#1a1208';c.lineWidth=2;c.beginPath();c.moveTo(S/2-12,2);c.lineTo(S/2+12,2);c.lineTo(S/2,26);c.closePath();c.fill();c.stroke();
}
function openWheel(){
  const free=wheelFree(),left=Math.ceil((WHEEL_H*HOUR-(Date.now()-(save.wheel||0)))/60000);
  dlg(`<h2 style="margin:0">🎡 Şans Çarkı</h2><canvas id="whC" width="520" height="520" style="width:min(260px,52vh);height:min(260px,52vh);display:block;margin:6px auto"></canvas>
    <div id="whM" class="stats" style="min-height:18px">${free?'Ücretsiz çevirme hakkın var!':'Sonraki ücretsiz: '+Math.floor(left/60)+' sa '+left%60+' dk'}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:6px"><button class="gold" id="whGo">${free?'Ücretsiz Çevir':'Çevir (5 💎)'}</button><button id="whX">Kapat</button></div>`);
  const cv=$('whC');let rot=0,busy=false;drawWheel(cv,0);
  $('whX').onclick=()=>{if(!busy){closeDlg();refreshCoins();}};
  $('whGo').onclick=()=>{
    if(busy)return;const fr=wheelFree();
    if(!fr){if(save.gems<5){$('whM').textContent='Yeterli 💎 yok.';return;}save.gems-=5;}else save.wheel=Date.now();
    persist();refreshCoins();ensureAudio();busy=true;
    let tot=WHEEL.reduce((a,b)=>a+b.w,0),x=Math.random()*tot,k=0;for(;k<WHEEL.length;k++){x-=WHEEL[k].w;if(x<0)break;}k=Math.min(k,WHEEL.length-1);
    save.pendRw={rw:WHEEL[k].rw,src:'Şans Çarkı'};persist(); // ödül hemen kayda geçer: çark dönerken oyun kapanırsa açılışta verilir
    const n=WHEEL.length,target=-k*2*Math.PI/n+(Math.random()-.5)*1.2*Math.PI/n,start=rot,end=target-2*Math.PI*(6+Math.floor(Math.random()*2)),t0=performance.now(),D=4200;let lastSeg=-1;
    const step=now=>{const q=Math.min(1,(now-t0)/D),e=1-Math.pow(1-q,3.2);rot=start+(end-start)*e;drawWheel(cv,rot);
      const seg=Math.floor(((-rot+Math.PI/n)/(2*Math.PI/n))%n+n)%n;if(seg!==lastSeg){lastSeg=seg;try{play('click',.25,1.8);}catch(_){}}
      if(q<1)requestAnimationFrame(step);else{busy=false;delete save.pendRw;const t=give(WHEEL[k].rw);track('wheel');if($('whM'))$('whM').innerHTML=`<b style="color:#f3d77a;font-size:18px">🎉 ${t}</b>`;if($('whGo'))$('whGo').textContent='Tekrar (5 💎)';rot=rot%(2*Math.PI);}};
    requestAnimationFrame(step);
  };
}

    while(cells.length<9){const j=Math.random()*SCR_P.length|0;if(j===wi||(cnt[j]||0)>=2)continue;cnt[j]=(cnt[j]||0)+1;cells.push(j);}

    const cv=$('scr').querySelector('canvas'),c=cv.getContext('2d');
    const g=c.createLinearGradient(0,0,480,480);g.addColorStop(0,'#c9ced6');g.addColorStop(.5,'#f4f5f8');g.addColorStop(1,'#9aa1ad');c.fillStyle=g;c.fillRect(0,0,480,480);
    c.fillStyle='rgba(60,70,80,.55)';c.font='900 44px Arial';c.textAlign='center';c.fillText('KAZI',240,230);c.font='700 26px Arial';c.fillText('parmağınla sürt',240,275);
    c.globalCompositeOperation='destination-out';let down=false,mv=0,done=false;
    const at=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*480,(e.clientY-r.top)/r.height*480];};
    const fin=()=>{if(done)return;done=true;finNow=null;cv.style.transition='opacity .4s';cv.style.opacity=0;
      if(win){delete save.pendRw;const t=give(SCR_P[wi].rw);if($('scM'))$('scM').innerHTML=`<b style="color:#f3d77a;font-size:18px">🎉 3× ${SCR_P[wi].ic} ${SCR_P[wi].t} — ${t}</b>`;}
      else if($('scM'))$('scM').textContent='Bu sefer olmadı. Yarın yine ücretsiz kart var!';
      if($('scGo')){$('scGo').disabled=false;$('scGo').textContent='Kart Al (1 💵)';}};
    finNow=fin;
    const rub=e=>{if(!down||done)return;const [x,y]=at(e);c.beginPath();c.arc(x,y,34,0,7);c.fill();
      if(++mv%8===0){const d=c.getImageData(0,0,480,480).data;let clr=0,tot=0;for(let i=3;i<d.length;i+=4*97){tot++;if(d[i]<40)clr++;}if(clr/tot>.45)fin();}};
    cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);rub(e);};cv.onpointermove=rub;cv.onpointerup=cv.onpointercancel=()=>down=false;
  };
}

    for(const t of ns){const parts=t.nodeValue.split(CH),fr=document.createDocumentFragment();parts.forEach((pt,i)=>{if(pt)fr.append(pt);if(i<parts.length-1){const c=document.createElement('i');c.className='chip';fr.append(c);}});t.replaceWith(fr);}};
  fix(document.body);new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData'){if(m.target.nodeValue&&m.target.nodeValue.includes(CH)&&m.target.parentNode)fix(m.target.parentNode);}else for(const a of m.addedNodes){if(a.nodeType===3){if(a.nodeValue.includes(CH)&&a.parentNode)fix(a.parentNode);}else if(a.nodeType===1&&a.textContent.includes(CH))fix(a);}}}).observe(document.body,{subtree:true,childList:true,characterData:true});
})();

(function boxFx(){

  const load=v=>{if(!v.src.endsWith(v.dataset.src)){v.src=v.dataset.src;v.preload='auto';}};
  function play(v,t){try{load(v);v.classList.add('on');const go=()=>{try{v.currentTime=t||0;}catch(_){}const p=v.play();if(p&&p.catch)p.catch(()=>{});};
    if(v.readyState>=1)go();else v.addEventListener('loadedmetadata',go,{once:true});}catch(_){}}
  function stopAll(free){V.forEach(v=>{try{v.pause();v.classList.remove('on');if(free&&v.src){v.removeAttribute('src');v.load();}}catch(_){}});}
  window.boxShowcase=function(){if(!$('shop').classList.contains('isBox'))return;V.forEach(v=>play(v,0));};

  const _sh=show;show=function(id){const r=_sh.apply(this,arguments);if(id!=='shop')stopAll(true);return r;};

  window._boxHold=0;
  const _bb=buyBox;buyBox=function(rar,n){if(window._boxLock>Date.now())return; // açılış efekti sürerken ikinci satın alma yok (çift nakit düşmesi)

window.bbaCopy=function(text,ok,fail){ok=ok||(()=>{});fail=fail||(()=>{});
  const old=()=>{try{const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.append(t);t.select();const r=document.execCommand('copy');t.remove();r?ok():fail();}catch(_){fail();}};

  if(bbaIsNative()&&C.registerPlugin)return window._bbaN||(window._bbaN=C.registerPlugin('BbaNative')); /* Capacitor'un belgelenmiş yolu; bir kez kaydedilir */}catch(_){}return null;};

  if(bbaIsNative())return Promise.reject('dosya köprüsü yok — yedek kodunu kopyala'); /* telefonda indirme bağlantısı çalışmaz: sahte "kaydedildi" deme */
  return new Promise((ok,no)=>{try{const u=URL.createObjectURL(new Blob([text],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok('İndirilenler/'+name);}catch(e){no(e.message||e);}});};
