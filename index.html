<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bilardo Ustası</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c1411;color:#e8efe9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;border:0;border-radius:12px;background:#24352b;color:#e8efe9;height:46px;min-width:46px;font-size:16px;cursor:pointer}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.45}
.gold{background:#e8c15a!important;color:#1b1a10!important;font-weight:700}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;touch-action:pan-y}
.screen.show{display:flex}
.coins{background:#1a2620;border:1px solid #3a4d40;border-radius:20px;padding:6px 14px;font-weight:700;color:#f3d77a}
/* giriş */
#login{justify-content:center;background:radial-gradient(circle at 50% 30%,#1d5a3a,#0c1411 70%);padding:calc(10px + env(safe-area-inset-top)) 20px 10px}
.lbox{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:340px}
.logo{text-align:center}.logo .ic{font-size:44px;line-height:1}.logo h1{margin:4px 0 0;font-size:26px}
.lg{width:100%;height:46px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.lg.g{background:#fff;color:#222}.lg.f{background:#1877f2;color:#fff}
.gi{font-weight:900;color:#4285f4;font-size:20px}.fi{font-weight:900;font-size:22px;font-family:Arial,sans-serif}
.or{font-size:12px;color:#9fb7a8}
#lname{width:100%;height:44px;border-radius:12px;border:1px solid #3a4d40;background:#0f1a15;color:#fff;padding:0 14px;font-size:16px}
#lmsg{font-size:12px;color:#f3d77a;text-align:center;min-height:16px}
/* ana menü */
#menu{justify-content:flex-start;gap:10px;padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 120%,#1d7a74 0%,#123c3a 35%,#0c1411 75%)}
.tbar{display:flex;align-items:stretch;gap:6px;width:100%;height:54px}
.prof{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border:1px solid rgba(232,193,90,.35);border-radius:14px;padding:4px 10px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;border:2px solid #fff;flex:none}
.prof b{font-size:14px;display:block;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.prof .sm{font-size:11px;color:#9fb7a8}
.lvl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#f3d77a;font-weight:700}
.xpb{width:56px;height:6px;background:#0b1410;border-radius:4px;overflow:hidden}.xpb i{display:block;height:100%;background:#e8c15a;width:0}
.tb{position:relative;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:20px;padding:0 10px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08)}
.tb span{font-size:10px;color:#cfe3d4}
.tb em{position:absolute;top:2px;right:4px;background:#e2453c;color:#fff;font-style:normal;font-size:11px;font-weight:800;border-radius:10px;padding:0 5px;display:none}
.cur{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:0 12px;font-weight:800;font-size:15px;white-space:nowrap}
.cur.cash{color:#6fdc7a}.cur.coins{color:#f3d77a;cursor:pointer}
.sp1{flex:1}
.mtitle{font-size:22px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.tiles{display:flex;gap:12px;width:100%;max-width:900px;flex:1;max-height:260px;min-height:140px}
.tile{flex:1;height:auto;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;color:#fff;border:3px solid rgba(255,255,255,.25);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -6px 0 rgba(0,0,0,.18);text-shadow:0 2px 4px rgba(0,0,0,.4)}
.tile b{font-size:30px;font-weight:900}.tile span{font-size:18px;font-weight:700;opacity:.95}
.tile .ic{font-size:30px}
.t1{background:linear-gradient(160deg,#5fd34a,#239a2c)}.t2{background:linear-gradient(160deg,#9b5de5,#5a2aa5)}.t3{background:linear-gradient(160deg,#3c8dde,#1e4fa8)}
.stats{font-size:12px;color:#9fb7a8}
/* liste ekranları (1'e 1, etkinlik, özel) */
.lscr{padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));gap:10px;background:#0f1a15}
.rooms{display:flex;gap:10px;width:100%;max-width:900px;overflow-x:auto;padding-bottom:6px;touch-action:pan-x}
.room{flex:1 0 170px;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid rgba(255,255,255,.15);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.room h3{margin:0;font-size:17px}.room .rw{font-size:13px;color:#e8efe9}
.room .pz{font-size:20px;font-weight:900;color:#f3d77a}
.room button{width:100%;margin-top:auto}
.room.lock{filter:grayscale(.7) brightness(.7)}
.r1{background:linear-gradient(160deg,#2b6e47,#163d28)}.r2{background:linear-gradient(160deg,#2d5f9a,#17345a)}.r3{background:linear-gradient(160deg,#7a3a9a,#3f1d55)}.r4{background:linear-gradient(160deg,#9a7a2a,#4f3b0f)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:7;padding:12px}
#dlg .box{background:#17221d;border:2px solid #e8c15a;border-radius:16px;padding:16px;text-align:center;max-width:560px;width:100%}
.days{display:flex;gap:6px;justify-content:center;margin:12px 0}
.day{flex:1;max-width:64px;border-radius:10px;background:#0f1a15;border:2px solid #24352b;padding:6px 2px;font-size:11px}
.day b{display:block;font-size:13px;color:#f3d77a}.day.done{opacity:.45}.day.now{border-color:#e8c15a;background:#2a2a14}
#grot{display:none;position:fixed;inset:0;background:#0c1411;z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:18px}
#grot .big{font-size:56px}
@media (orientation:portrait){#grot{display:flex}}
/* market */
#shop{padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));gap:10px;background:#0f1a15}
.top{display:flex;align-items:center;gap:10px;width:100%;max-width:520px}
.top h2{flex:1;margin:0;font-size:20px}
.tabs{display:flex;gap:8px;width:100%;max-width:520px}
.tabs button{flex:1}
.tabs button.on{background:#e8c15a;color:#1b1a10;font-weight:700}
#items{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;padding-bottom:20px}
.item{display:flex;align-items:center;gap:12px;background:#17221d;border:2px solid #24352b;border-radius:14px;padding:10px}
.item.eq{border-color:#e8c15a}
.item canvas{flex:none;border-radius:8px}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:15px}
.item .st{font-size:12px;color:#9fb7a8;margin-top:3px}
.item button{flex:none;min-width:96px;font-size:14px;height:40px}
#pvm{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:6;padding:12px}
.pbox{background:#17221d;border:2px solid #e8c15a;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;max-height:100%}
.ptop{display:flex;width:100%;align-items:center;gap:8px}.ptop b{flex:1;font-size:18px}
#pvc{border-radius:10px}#pvst{font-size:12px;color:#9fb7a8}
#pvmsg{color:#f3d77a;font-size:13px;min-height:16px;text-align:center}
#pvbtn{min-width:190px}.pvhint{font-size:12px;color:#e8c15a;margin-top:4px}
.item canvas,.item .info{cursor:pointer}
#smsg{min-height:18px;font-size:13px;color:#f3d77a}
/* oyun (yatay) */
#game{padding:calc(4px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));gap:4px;overflow:hidden;touch-action:none}
#hud{display:flex;gap:6px;width:100%;align-items:center}
.pl{flex:0 0 auto;width:min(30%,230px);border-radius:10px;padding:4px 8px;background:#17221d;border:2px solid transparent;font-size:11px;transition:border-color .2s,background .2s;display:flex;align-items:center;gap:6px;min-height:36px}
.pl.on{border-color:#e8c15a;background:#21301f}
.pl b{font-size:13px;white-space:nowrap}
.pl .gl{white-space:nowrap;color:#9fb7a8}
.dots{display:flex;gap:2px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:inset -1px -1px 2px rgba(0,0,0,.4)}
.dot.st{background:linear-gradient(#f4f1e8 25%,var(--c) 25% 75%,#f4f1e8 75%)!important}
#msg{flex:1;font-size:12px;color:#cfe3d4;text-align:center;line-height:1.25}
#mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:0}
#c{display:block;touch-action:none;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:none;width:72px}
#pbar{touch-action:none;border-radius:14px;cursor:grab}
.lbl{font-size:11px;color:#9fb7a8;text-align:center}
#spin{touch-action:none;cursor:pointer}
.side button{width:56px;height:42px;font-size:18px}
#rot{display:none;position:absolute;inset:0;background:#0c1411;z-index:4;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:18px}
#rot .big{font-size:56px}

#over{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:5}
#over .box{background:#17221d;border:2px solid #e8c15a;border-radius:16px;padding:22px 24px;text-align:center;width:290px}
#over h2{margin:0 0 6px;font-size:22px}
#over p{margin:0 0 6px;color:#cfe3d4}
#over .earn{font-size:20px;font-weight:700;color:#f3d77a;min-height:26px;margin-bottom:14px}
#over .row{display:flex;gap:8px}
#over .row button{flex:1}
</style>
</head>
<body>

<!-- GİRİŞ -->
<div id="login" class="screen">
  <div class="lbox">
    <div class="logo"><div class="ic">🎱</div><h1>Bilardo Ustası</h1></div>
    <button class="lg g" id="lgG"><span class="gi">G</span> Google ile giriş</button>
    <button class="lg f" id="lgF"><span class="fi">f</span> Facebook ile giriş</button>
    <div class="or">veya</div>
    <input id="lname" maxlength="14" placeholder="Oyuncu adın" autocomplete="off">
    <button class="lg gold" id="lgGuest">Misafir olarak oyna</button>
    <div id="lmsg"></div>
  </div>
</div>

<!-- ANA MENÜ -->
<div id="menu" class="screen">
  <div class="tbar">
    <div class="prof"><div class="av" id="av"></div><div><b id="pname"></b><div class="sm">ID: <span id="pid"></span></div></div>
      <div class="lvl"><span>⭐ <span id="plv"></span></span><div class="xpb"><i id="pxp"></i></div></div></div>
    <button class="tb" id="tCues">🎱<span>İstekalar</span></button>
    <button class="tb" id="tDaily">🎁<span>Günlük Ödül</span><em id="dDot">!</em></button>
    <button class="tb" id="tShop">🛒<span>Mağaza</span></button>
    <div class="sp1"></div>
    <div class="cur cash">💵 <span id="cash">0</span></div>
    <div class="cur coins" id="mcoins">🪙 <span class="cv">0</span></div>
  </div>
  <div class="mtitle">🎱 Bilardo Ustası</div>
  <div class="tiles">
    <button class="tile t1" id="m1v1"><span class="ic">🎱</span><b>1'e 1</b><span>Oyna</span></button>
    <button class="tile t2" id="mEv"><span class="ic">🏆</span><b>Etkinlikler</b><span>Turnuva</span></button>
    <button class="tile t3" id="mPriv"><span class="ic">👥</span><b>Özel</b><span>Oyun</span></button>
  </div>
  <div class="stats" id="stats"></div>
</div>

<!-- 1'E 1 MASALAR -->
<div id="rooms" class="screen lscr">
  <div class="top"><button class="back">←</button><h2>1'e 1 Oyna · Masa seç</h2><div class="coins">🪙 <span class="cv">0</span></div></div>
  <div class="rooms" id="roomList"></div>
  <div id="rmsg" class="stats"></div>
</div>

<!-- ETKİNLİKLER -->
<div id="events" class="screen lscr">
  <div class="top"><button class="back">←</button><h2>Etkinlikler</h2><div class="coins">🪙 <span class="cv">0</span></div></div>
  <div class="rooms" id="evList"></div>
  <div id="emsg" class="stats"></div>
</div>

<!-- ÖZEL OYUN -->
<div id="priv" class="screen lscr">
  <div class="top"><button class="back">←</button><h2>Özel Oyun</h2><div class="coins">🪙 <span class="cv">0</span></div></div>
  <div class="rooms">
    <div class="room r2"><h3>👥 2 Kişilik</h3><div class="rw">Aynı telefonda arkadaşınla sırayla oyna</div><button class="gold" id="p2p">Başla</button></div>
    <div class="room r1"><h3>🤖 Antrenman</h3><div class="rw">Bilgisayara karşı serbest maç<br>(ödül yok)</div>
      <div style="display:flex;gap:6px;width:100%;margin-top:auto"><button data-tr="easy" style="flex:1">Kolay</button><button data-tr="mid" style="flex:1">Orta</button><button data-tr="hard" style="flex:1">Zor</button></div></div>
  </div>
</div>

<div id="dlg"><div class="box" id="dlgBox"></div></div>
<div id="grot"><div class="big">📱↻</div>Telefonu yan çevir</div>

<!-- MARKET -->
<div id="shop" class="screen lscr">
  <div class="top"><button id="sback">←</button><h2>Mağaza</h2><div class="coins">🪙 <span class="cv">0</span></div></div>
  <div class="tabs"><button data-t="cues" class="on">Sopalar</button><button data-t="tables">Masalar</button></div>
  <div id="smsg"></div>
  <div id="items"></div>
</div>

<!-- OYUN -->
<div id="game" class="screen">
  <div id="hud"><div class="pl" id="p0"></div><div id="msg"></div><div class="pl" id="p1"></div></div>
  <div id="mid">
    <div class="side"><div class="lbl">Güç<br><b id="pv">0%</b></div><canvas id="pbar"></canvas><div class="lbl">Çek ↓<br>bırak</div></div>
    <canvas id="c"></canvas>
    <div class="side">
      <canvas id="spin"></canvas><div class="lbl">Falso</div>
      <button id="l" aria-label="Sola çevir">↺</button>
      <button id="r" aria-label="Sağa çevir">↻</button>
      <button id="gmenu" aria-label="Menü">☰</button>
    </div>
  </div>
</div>
<div id="pvm"><div class="pbox">
  <div class="ptop"><b id="pvname"></b><button id="pvx" aria-label="Kapat">✕</button></div>
  <canvas id="pvcue"></canvas>
  <canvas id="pvc"></canvas>
  <div id="pvst"></div><div id="pvmsg"></div>
  <button id="pvbtn"></button>
</div></div>
<div id="over"><div class="box"><h2 id="ot"></h2><p id="op"></p><div class="earn" id="oe"></div>
  <div class="row"><button id="omenu">Menü</button><button id="again" class="gold">Tekrar</button></div><div id="olv" class="stats" style="margin-top:8px"></div></div></div>

<script>
/* ================= VERİLER ================= */
const CUES=[
 {id:'basic',  name:'Başlangıç',price:0,    pow:1.00,aim:1.0,shaft:'#d9b77d',butt:'#5a3215',ring:'#2a1a0c'},
 {id:'bronze', name:'Bronz',    price:500,  pow:1.05,aim:1.3,shaft:'#e0c08a',butt:'#8c4a1e',ring:'#cd7f32'},
 {id:'silver', name:'Gümüş',    price:1500, pow:1.10,aim:1.6,shaft:'#e6d2a8',butt:'#3a3f4a',ring:'#d5dae2'},
 {id:'gold',   name:'Altın',    price:4000, pow:1.15,aim:1.9,shaft:'#f0dcb0',butt:'#1a1a1a',ring:'#e8c15a'},
 {id:'dragon', name:'Ejderha',  price:8000, pow:1.20,aim:2.2,shaft:'#ead2a0',butt:'#8f1010',ring:'#ffb020'},
 {id:'diamond',name:'Elmas',    price:15000,pow:1.25,aim:2.6,shaft:'#f4ead2',butt:'#1b3b6f',ring:'#9fe8ff'},
];
const TABLES=[
 {id:'green', name:'Klasik Yeşil',price:0,   f1:'#2a9a5e',f2:'#1b6e43',c:'#145a36',w1:'#6b3d1a',w2:'#4a2810',d:'#e9dcc0'},
 {id:'blue',  name:'Okyanus',     price:300, f1:'#2d7fc4',f2:'#1b5690',c:'#154575',w1:'#5c3a1c',w2:'#3d240f',d:'#e9dcc0'},
 {id:'red',   name:'Bordo',       price:600, f1:'#a8323a',f2:'#7a1f26',c:'#5e161c',w1:'#3b2414',w2:'#24150b',d:'#e9dcc0'},
 {id:'black', name:'Gece',        price:1200,f1:'#3a3f45',f2:'#1f2327',c:'#16191c',w1:'#2a2a2a',w2:'#111111',d:'#9fe8ff'},
 {id:'purple',name:'Mor Lüks',    price:2500,f1:'#7a45b8',f2:'#4f2a80',c:'#3d1f66',w1:'#e8e8ee',w2:'#9a9aa8',d:'#4f2a80'},
 {id:'royal', name:'Kraliyet',    price:5000,f1:'#1d6b5c',f2:'#0f4238',c:'#0b342c',w1:'#f0cf6a',w2:'#9a7420',d:'#0f4238'},
];
const DIFF={
 easy:{name:'Kolay',err:.05, pErr:.18,reward:100,think:1000,pick:3},
 mid: {name:'Orta', err:.018,pErr:.08,reward:250,think:850, pick:2},
 hard:{name:'Zor',  err:.005,pErr:.03,reward:600,think:700, pick:1},
 pro: {name:'Usta', err:.002,pErr:.02,reward:0,  think:600, pick:1},
};
const ROOMS=[
 {id:'r1',name:'Mahalle Kahvesi',fee:50,  prize:100,  diff:'easy',lvl:1,cls:'r1'},
 {id:'r2',name:'Şehir Salonu',   fee:250, prize:500,  diff:'mid', lvl:2,cls:'r2'},
 {id:'r3',name:'Büyük Salon',    fee:1000,prize:2000, diff:'hard',lvl:4,cls:'r3'},
 {id:'r4',name:'Kraliyet Kulübü',fee:5000,prize:10000,diff:'pro', lvl:7,cls:'r4'},
];
const TOUR={name:'Hafta Sonu Turnuvası',fee:200,prize:1500,cash:2,rounds:['easy','mid','hard']};
const DAILY=[100,150,200,300,400,500,1000];

/* ================= KAYIT ================= */
const KEY='bilardo_ustasi_v1';
let save={coins:200,cues:['basic'],tables:['green'],cue:'basic',table:'green',wins:0,losses:0,name:'',pid:0,level:1,xp:0,cash:5,lastDaily:0,streak:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const cueById=id=>CUES.find(c=>c.id===id)||CUES[0];
const tableById=id=>TABLES.find(t=>t.id===id)||TABLES[0];

/* ================= EKRANLAR ================= */
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id));refreshCoins();if(id==='game')resize();}
const xpNeed=l=>100+l*40;
const AVC=['#ff9800','#e2453c','#3c8dde','#2fa84f','#9b5de5','#e91e63','#00a8a8'];
function refreshCoins(){
  document.querySelectorAll('.cv').forEach(e=>e.textContent=save.coins.toLocaleString('tr-TR'));
  $('stats').textContent=`Galibiyet: ${save.wins} · Mağlubiyet: ${save.losses}`;
  $('cash').textContent=save.cash;$('pname').textContent=save.name||'Oyuncu';$('pid').textContent=save.pid||'-';
  $('av').textContent=(save.name||'O')[0].toLocaleUpperCase('tr-TR');$('av').style.background=AVC[save.pid%AVC.length];
  $('plv').textContent=save.level;$('pxp').style.width=Math.min(100,save.xp/xpNeed(save.level)*100)+'%';
  $('dDot').style.display=dailyReady()?'block':'none';
}
function addXp(n){
  save.xp+=n;let up='';
  while(save.xp>=xpNeed(save.level)){save.xp-=xpNeed(save.level);save.level++;save.cash+=1;save.coins+=save.level*25;up=`⭐ Seviye ${save.level}! +${save.level*25} 🪙 +1 💵`;}
  return up;
}

/* ================= FİZİK ================= */
function pot(b){if(b.pot)return;b.pot=true;b.vx=b.vy=0;shotPotted.push(b.id);snd(12,180,.18);}
// falso: yan falso bant dönüşünü, üst/alt falso ilk çarpışmadan sonrasını etkiler
let inDir=null;
function side(b){inDir=b===cue&&shotSpin&&Math.abs(shotSpin.x)>.02?{x:b.vx,y:b.vy}:null;}
function sideKick(b){
  if(!inDir)return;const sp=Math.hypot(inDir.x,inDir.y);if(sp<.05)return;
  const rx=-inDir.y/sp,ry=inDir.x/sp,k=shotSpin.x*sp*.32;
  b.vx+=rx*k;b.vy+=ry*k;shotSpin.x*=.45;inDir=null;
}
function physStep(f){
  for(const b of balls){if(b.pot)continue;b.x+=b.vx*f;b.y+=b.vy*f;}
  for(const b of balls){
    if(b.pot)continue;
    for(const p of POCKETS){if((b.x-p.x)**2+(b.y-p.y)**2<p.r*p.r){pot(b);break;}}
    if(b.pot)continue;
    const gapV=b.y<14||b.y>TH-14,gapH=b.x<14||b.x>TW-14||Math.abs(b.x-TW/2)<16;
    if(!gapV){
      if(b.x<R){side(b);b.x=R;b.vx=-b.vx*.78;sideKick(b);snd(Math.abs(b.vx),600,.05);}
      else if(b.x>TW-R){side(b);b.x=TW-R;b.vx=-b.vx*.78;sideKick(b);snd(Math.abs(b.vx),600,.05);}
    }
    if(!gapH){
      if(b.y<R){side(b);b.y=R;b.vy=-b.vy*.78;sideKick(b);snd(Math.abs(b.vy),600,.05);}
      else if(b.y>TH-R){side(b);b.y=TH-R;b.vy=-b.vy*.78;sideKick(b);snd(Math.abs(b.vy),600,.05);}
    }
    if(b.x<-2*R||b.x>TW+2*R||b.y<-2*R||b.y>TH+2*R)pot(b);
  }
  for(let i=0;i<balls.length;i++){const a=balls[i];if(a.pot)continue;
    for(let j=i+1;j<balls.length;j++){const b=balls[j];if(b.pot)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2<4*R*R&&d2>1e-6){
        const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*R-d)/2;
        a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
        if(rel>0){
          const cb=a===cue?a:b===cue?b:null,sp0=cb?Math.hypot(cb.vx,cb.vy):0;
          const j2=rel*.975;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny;
          if(cb&&shotSpin&&!shotSpin.used&&Math.abs(shotSpin.y)>.02){shotSpin.used=1;const k=-shotSpin.y*sp0*.62;cb.vx+=shotSpin.dx*k;cb.vy+=shotSpin.dy*k;}
          if(firstHit===null){if(a.id===0)firstHit=b.id;else if(b.id===0)firstHit=a.id;}
          snd(rel,1900,.05);
        }
      }
    }
  }
}
function friction(){
  let any=false;
  for(const b of balls){if(b.pot)continue;
    const s=Math.hypot(b.vx,b.vy);
    if(s<.05){b.vx=b.vy=0;continue;}
    const ns=Math.max(0,s*.989-.012);b.vx*=ns/s;b.vy*=ns/s;any=true;
  }
  return any;
}

/* ================= ATIŞ & KURALLAR ================= */
function remaining(g){return balls.filter(b=>!b.pot&&groupOf(b.id)===g).length;}
function shoot(){
  if(moving||over)return;ensureAudio();
  const sp=power/100*MAXV*cueOf(turn).pow;
  cue.vx=Math.cos(aim)*sp;cue.vy=Math.sin(aim)*sp;
  shotSpin=isAI(turn)?null:{x:spinX,y:spinY,dx:Math.cos(aim),dy:Math.sin(aim),used:0};
  if(!isAI(turn)){spinX=spinY=0;drawSpin();}
  const g=groups[turn];
  shotCtx={g,cleared:g?remaining(g)===0:false,isBreak:shots===0};
  firstHit=null;shotPotted=[];ballInHand=false;moving=true;shots++;aiShowAim=false;
  snd(sp,2400,.05);setMsg('');
}
function freeSpot(x,y){
  for(let r=0;r<400;r+=4)for(let a=0;a<6.28;a+=.5){
    const px=Math.min(TW-R,Math.max(R,x+Math.cos(a)*r)),py=Math.min(TH-R,Math.max(R,y+Math.sin(a)*r));
    if(balls.every(o=>o.pot||o===cue||Math.hypot(o.x-px,o.y-py)>2*R+1))return[px,py];
  }return[x,y];
}
function endShot(){
  const p=turn,s=shotCtx,potted=shotPotted.filter(i=>i!==0),scratch=shotPotted.includes(0);
  let foul=false,why='';
  if(scratch){foul=true;why='beyaz top deliğe girdi';}
  else if(firstHit===null){foul=true;why='hiçbir topa değmedi';}
  else if(s.g){const t=s.cleared?'eight':s.g;if(groupOf(firstHit)!==t){foul=true;why=s.cleared?'önce 8 numaraya vurulmalıydı':'önce kendi grubuna ('+LABEL[s.g]+') vurulmalıydı';}}
  else if(firstHit===8&&!s.isBreak){foul=true;why='ilk 8 numaraya vurulamaz';}

  if(potted.includes(8)){
    if(s.isBreak){const e=balls.find(b=>b.id===8);e.pot=false;[e.x,e.y]=freeSpot(TW*0.72,TH/2);}
    else{
      if(s.g&&s.cleared&&!foul)return gameOver(p,you(p)?'8 numarayı soktun!':NAMES[p]+' 8 numarayı soktu!');
      return gameOver(1-p,(you(p)?'8 numarayı ':NAMES[p]+' 8 numarayı ')+(foul?'faulle sok':'erken sok')+(you(p)?'tun.':'tu.'));
    }
  }
  if(scratch){cue.pot=false;cue.vx=cue.vy=0;[cue.x,cue.y]=freeSpot(TW*0.25,TH/2);}
  let extra='';
  const real=potted.filter(i=>i!==8);
  if(!groups[p]&&!foul&&real.length&&!s.isBreak){
    const g=groupOf(real[0]);groups[p]=g;groups[1-p]=g==='solid'?'stripe':'solid';
    extra=NAMES[p]+': '+LABEL[g]+'. ';
  }
  const own=groups[p]?real.some(i=>groupOf(i)===groups[p]):real.length>0;
  if(foul){turn=1-p;ballInHand=true;setMsg(extra+'Faul: '+why+'. '+(isAI(turn)?'Beyaz top bilgisayarda.':NAMES[turn]+' — beyaz top elinde (sürükle).'));}
  else if(own){setMsg(extra+(you(p)?'Devam ediyorsun.':NAMES[p]+' devam ediyor.'));}
  else{turn=1-p;setMsg(extra+(isAI(turn)?'Sıra bilgisayarda.':'Sıra '+NAMES[turn]+'.'));}
  updateHud();
  if(isAI(turn))scheduleAI();else{power=0;drawPbar();}
}
function gameOver(w,why){
  over=true;clearTimeout(aiTimer);updateHud();
  let earn='',up='',again='Tekrar',title=mode==='ai'?(w===0?'🏆 Kazandın!':'😞 Kaybettin'):'🏆 '+NAMES[w]+' kazandı!';
  const k=gopt.kind;
  if(k==='match'||k==='event'){
    if(w===0)save.wins++;else save.losses++;
    up=addXp(w===0?60:20);
    if(k==='match'){if(w===0){save.coins+=gopt.room.prize;earn='+'+gopt.room.prize.toLocaleString('tr-TR')+' 🪙';}again='Tekrar ('+gopt.room.fee+' 🪙)';}
    else if(w===0&&gopt.round<2){title=`✅ Tur ${gopt.round+1} kazanıldı!`;again='Sonraki tur →';}
    else if(w===0){save.coins+=TOUR.prize;save.cash+=TOUR.cash;earn=`+${TOUR.prize.toLocaleString('tr-TR')} 🪙 +${TOUR.cash} 💵`;title='🏆 Turnuva şampiyonu!';again='Yeni turnuva';}
    else{title='😞 Turnuvadan elendin';again='Yeni turnuva';}
    persist();refreshCoins();
  }
  $('ot').textContent=title;$('again').textContent=again;
  $('op').textContent=why;$('oe').textContent=earn;$('olv').textContent=up;
  $('over').style.display='flex';
}
function setMsg(t){$('msg').textContent=t;}
function updateHud(){
  for(let i=0;i<2;i++){
    const el=$('p'+i),g=groups[i];
    el.classList.toggle('on',turn===i&&!over);
    let dots='';
    if(g){balls.filter(b=>!b.pot&&groupOf(b.id)===g).sort((a,b)=>a.id-b.id).forEach(b=>{dots+=`<span class="dot${g==='stripe'?' st':''}" style="background:${col(b.id)};--c:${col(b.id)}"></span>`;});
      if(!remaining(g))dots='<span class="dot" style="background:#111;border:1px solid #888"></span> 8 numara!';}
    el.innerHTML=`<b>${NAMES[i]}${turn===i&&!over?' 🎱':''}</b>${g?LABEL[g]+' ('+remaining(g)+')':'Grup belli değil'}<div class="dots">${dots}</div>`;
  }
}

/* ================= YAPAY ZEKÂ ================= */
function speedAfter(v,d){let s=0;while(v>0.05&&s<d){s+=v;v=v*.989-.012;}return s>=d?v:0;}
function neededStart(dist,vEnd){for(let v=0.5;v<=40;v+=0.25)if(speedAfter(v,dist)>=vEnd)return v;return 99;}
function clearPath(ax,ay,bx,by,ignore){
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1;
  for(const o of balls){if(o.pot||ignore.includes(o))continue;
    let t=((o.x-ax)*dx+(o.y-ay)*dy)/L2;t=Math.max(0,Math.min(1,t));
    const px=ax+dx*t-o.x,py=ay+dy*t-o.y;if(px*px+py*py<(2*R-0.5)**2)return false;}
  return true;
}
function legalTargets(p){
  const g=groups[p];
  if(g){const own=balls.filter(b=>!b.pot&&groupOf(b.id)===g);return own.length?own:balls.filter(b=>!b.pot&&b.id===8);}
  return balls.filter(b=>!b.pot&&b.id!==0&&b.id!==8);
}
function findShots(cx,cy,targets){
  const res=[];
  for(const t of targets)for(const p of AIMPTS){
    const dx=p.x-t.x,dy=p.y-t.y,d2=Math.hypot(dx,dy),ux=dx/d2,uy=dy/d2;
    if(p.mid&&Math.abs(uy)<.4)continue;
    const gx=t.x-ux*2*R,gy=t.y-uy*2*R;
    if(gx<R-1||gx>TW-R+1||gy<R-1||gy>TH-R+1)continue;
    const ax=gx-cx,ay=gy-cy,d1=Math.hypot(ax,ay);if(d1<2)continue;
    const cos=(ax*ux+ay*uy)/d1;if(cos<.3)continue;
    if(!clearPath(cx,cy,gx,gy,[cue,t]))continue;
    if(!clearPath(t.x,t.y,p.x,p.y,[t,cue]))continue;
    const vT=neededStart(d2+20,.6),v0=neededStart(d1,vT/(cos*.975));
    if(v0>MAXV)continue;
    res.push({aim:Math.atan2(ay,ax),power:Math.min(100,Math.max(12,v0/MAXV*100*1.12)),score:cos*cos*1000/(d1+d2*1.6+60)});
  }
  return res.sort((a,b)=>b.score-a.score);
}
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*1.4;
function scheduleAI(){
  aiBusy=true;setMsg('Bilgisayar düşünüyor…');
  aiTimer=setTimeout(aiTurn,500);
}
function aiTurn(){
  if(over||!isAI(turn)){aiBusy=false;return;}
  const D=DIFF[diff],targets=legalTargets(1);
  let cands=[];
  if(ballInHand){
    let bestPos=[cue.x,cue.y],bestS=findShots(cue.x,cue.y,targets);
    for(let i=0;i<70;i++){
      const x=R+Math.random()*(TW-2*R),y=R+Math.random()*(TH-2*R);
      if(!balls.every(o=>o.pot||o===cue||Math.hypot(o.x-x,o.y-y)>2*R+1))continue;
      const s=findShots(x,y,targets);
      if(s.length&&(!bestS.length||s[0].score>bestS[0].score)){bestS=s;bestPos=[x,y];}
    }
    cue.x=bestPos[0];cue.y=bestPos[1];cands=bestS;
  }else cands=findShots(cue.x,cue.y,targets);
  let a,pw;
  if(cands.length){
    const s=cands[Math.floor(Math.random()*Math.min(D.pick,cands.length))];a=s.aim;pw=s.power;
  }else{ // savunma: en yakın, yolu açık topa vur
    let nb=null,nd=1e9;
    for(const t of targets){const d=Math.hypot(t.x-cue.x,t.y-cue.y);if(clearPath(cue.x,cue.y,t.x,t.y,[cue,t])&&d<nd){nd=d;nb=t;}}
    nb=nb||targets[0];a=Math.atan2(nb.y-cue.y,nb.x-cue.x);pw=45;
  }
  aim=a+gauss()*D.err;power=Math.min(100,Math.max(8,pw*(1+gauss()*D.pErr)));
  setMsg('Bilgisayar nişan alıyor…');aiShowAim=true;
  aiTimer=setTimeout(()=>{aiBusy=false;if(!over&&isAI(turn))shoot();},D.think);
}

/* ================= ÇİZİM ================= */
function drawCue(c,x1,y1,x2,y2,cueD,w){ // x1,y1 = uç
  const seg=(a,b,color,width)=>{c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1+(x2-x1)*a,y1+(y2-y1)*a);c.lineTo(x1+(x2-x1)*b,y1+(y2-y1)*b);c.stroke();};
  c.lineCap='butt';
  seg(.02,.55,cueD.shaft,w*.8);seg(.55,.62,cueD.shaft,w*.9);
  seg(.62,.64,cueD.ring,w);seg(.64,.97,cueD.butt,w*1.1);
  seg(.72,.735,cueD.ring,w*1.1);seg(.88,.895,cueD.ring,w*1.1);
  seg(.97,1,'#0d0d0d',w*1.1);
  seg(.008,.02,'#f4f1e8',w*.75);seg(0,.008,'#3d6fb0',w*.7);
}
function drawMiniTable(c,w,h,t){
  c.fillStyle=t.w1;rrp(c,0,0,w,h,8);c.fill();
  const g=c.createRadialGradient(w/2,h/2,4,w/2,h/2,w*.6);g.addColorStop(0,t.f1);g.addColorStop(1,t.f2);
  c.fillStyle=g;c.fillRect(7,7,w-14,h-14);
  c.fillStyle='#050505';for(const [x,y] of [[7,7],[w/2,6],[w-7,7],[7,h-7],[w/2,h-6],[w-7,h-7]]){c.beginPath();c.arc(x,y,3.5,0,7);c.fill();}
  c.fillStyle='#fff';c.beginPath();c.arc(w*.3,h/2,3,0,7);c.fill();c.fillStyle='#d22b2b';c.beginPath();c.arc(w*.65,h/2,3,0,7);c.fill();
}
function rrp(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawTable(T){
  T=T||tableById(save.table);
  let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,T.w1);g.addColorStop(.5,T.w2);g.addColorStop(1,T.w1);
  ctx.fillStyle=g;rrp(ctx,0,0,W,H,16);ctx.fill();
  ctx.fillStyle=T.c;ctx.fillRect(RAIL-6,RAIL-6,TW+12,TH+12);
  g=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,H*.6);g.addColorStop(0,T.f1);g.addColorStop(1,T.f2);
  ctx.fillStyle=g;ctx.fillRect(RAIL,RAIL,TW,TH);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(RAIL+TW*.25,RAIL);ctx.lineTo(RAIL+TW*.25,RAIL+TH);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(RAIL+TW*.72,RAIL+TH/2,2,0,7);ctx.fill();
  ctx.fillStyle=T.d;
  for(let i=1;i<4;i++){dia(RAIL/2,RAIL+TH*i/4);dia(W-RAIL/2,RAIL+TH*i/4);}
  for(let i=1;i<8;i++){if(i===4)continue;dia(RAIL+TW*i/8,RAIL/2);dia(RAIL+TW*i/8,H-RAIL/2);}
  for(const p of POCKETS){
    ctx.fillStyle='#2b1a0c';ctx.beginPath();ctx.arc(p.x+RAIL,p.y+RAIL,p.r+3,0,7);ctx.fill();
    ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(p.x+RAIL,p.y+RAIL,p.r,0,7);ctx.fill();
  }
}
function dia(x,y){ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill();}
function drawBall(b){
  const x=b.x+RAIL,y=b.y+RAIL;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+2.5,y+3,R,R*.85,0,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.clip();
  if(b.id>8){ctx.fillStyle='#f4f1e8';ctx.fillRect(x-R,y-R,2*R,2*R);ctx.fillStyle=col(b.id);ctx.fillRect(x-R,y-R*.55,2*R,R*1.1);}
  else{ctx.fillStyle=b.id===0?'#f7f5ee':col(b.id);ctx.fillRect(x-R,y-R,2*R,2*R);}
  if(b.id>0){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,R*.5,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.font=`bold ${b.id>9?6:7}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.id,x,y+.5);}
  const g=ctx.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R*1.05);
  g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(.3,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.38)');
  ctx.fillStyle=g;ctx.fillRect(x-R,y-R,2*R,2*R);ctx.restore();
}
function predict(){
  const dx=Math.cos(aim),dy=Math.sin(aim);let best=Infinity,tb=null;
  for(const b of balls){if(b.pot||b===cue)continue;
    const ox=b.x-cue.x,oy=b.y-cue.y,t=ox*dx+oy*dy;if(t<=0)continue;
    const p2=ox*ox+oy*oy-t*t,rr=4*R*R;if(p2>rr)continue;
    const tt=t-Math.sqrt(rr-p2);if(tt<best){best=tt;tb=b;}}
  let tw=Infinity;
  if(dx>1e-6)tw=Math.min(tw,(TW-R-cue.x)/dx);if(dx<-1e-6)tw=Math.min(tw,(R-cue.x)/dx);
  if(dy>1e-6)tw=Math.min(tw,(TH-R-cue.y)/dy);if(dy<-1e-6)tw=Math.min(tw,(R-cue.y)/dy);
  return tb&&best<tw?{t:best,b:tb}:{t:tw,b:null};
}
function drawAim(){
  const C=cueOf(turn),dx=Math.cos(aim),dy=Math.sin(aim),cx=cue.x+RAIL,cy=cue.y+RAIL,pr=predict();
  const gx=cx+dx*pr.t,gy=cy+dy*pr.t;
  if(!isAI(turn)){
    ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(cx+dx*R,cy+dy*R);ctx.lineTo(gx,gy);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(gx,gy,R,0,7);ctx.stroke();
    if(pr.b){
      const bx=pr.b.x+RAIL,by=pr.b.y+RAIL,nx=(bx-gx)/(2*R),ny=(by-gy)/(2*R);
      const g=groups[turn],ok=!g||groupOf(pr.b.id)===(remaining(g)?g:'eight');
      ctx.strokeStyle=ok&&(g||pr.b.id!==8)?'rgba(255,230,120,.9)':'rgba(255,90,90,.9)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+nx*60*C.aim,by+ny*60*C.aim);ctx.stroke();
      const dot=dx*nx+dy*ny,tx=dx-dot*nx,ty=dy-dot*ny;
      ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+tx*40*C.aim,gy+ty*40*C.aim);ctx.stroke();
    }
  }
  const back=R+6+power*.45,len=330,sx=cx-dx*back,sy=cy-dy*back,ex=cx-dx*(back+len),ey=cy-dy*(back+len);
  ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx+3,sy+4);ctx.lineTo(ex+3,ey+4);ctx.stroke();
  drawCue(ctx,sx,sy,ex,ey,C,6.5);
}
function draw(){
  ctx.setTransform(dprK,0,0,dprK,0,0);ctx.clearRect(0,0,W,H);
  drawTable();
  for(const b of balls)if(!b.pot)drawBall(b);
  if(!moving&&!over&&!cue.pot&&(!isAI(turn)||aiShowAim)){
    if(ballInHand&&!isAI(turn)){ctx.setLineDash([3,4]);ctx.strokeStyle='#e8c15a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cue.x+RAIL,cue.y+RAIL,R+7,0,7);ctx.stroke();ctx.setLineDash([]);}
    drawAim();
  }
}

/* ================= DÖNGÜ ================= */
function loop(){
  sndCount=0;
  if($('game').classList.contains('show')){
    if(moving){for(let i=0;i<10;i++)physStep(.1);if(!friction()){moving=false;endShot();}}
    draw();
  }
  requestAnimationFrame(loop);
}

/* ================= GİRİŞ ================= */
const humanTurn=()=>!moving&&!over&&!isAI(turn)&&!aiBusy;
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale-RAIL,y:(e.clientY-r.top)/scale-RAIL};}
cv.addEventListener('pointerdown',e=>{
  if(!humanTurn())return;ensureAudio();cv.setPointerCapture(e.pointerId);
  const p=pt(e);
  if(ballInHand&&Math.hypot(p.x-cue.x,p.y-cue.y)<R*3.5){dragCue=true;return;}
  aiming=true;setAim(p);
});
cv.addEventListener('pointermove',e=>{
  if(!humanTurn())return;const p=pt(e);
  if(dragCue){
    const x=Math.min(TW-R,Math.max(R,p.x)),y=Math.min(TH-R,Math.max(R,p.y));
    if(balls.every(o=>o===cue||o.pot||Math.hypot(o.x-x,o.y-y)>2*R+.5)){cue.x=x;cue.y=y;}
  }else if(aiming)setAim(p);
});
const endP=()=>{dragCue=false;aiming=false;};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
function setAim(p){const dx=p.x-cue.x,dy=p.y-cue.y;if(dx*dx+dy*dy>4)aim=Math.atan2(dy,dx);}
function hold(id,d){
  const el=$(id);let t=null,t2=null;
  const stop=()=>{clearTimeout(t);clearInterval(t2);};
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(!humanTurn())return;aim+=d;t=setTimeout(()=>{t2=setInterval(()=>{if(humanTurn())aim+=d;},30);},300);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
}
hold('l',-0.004);hold('r',0.004);
/* ---- güç çubuğu: aşağı çek, bırakınca vur ---- */
const pb=$('pbar'),sp=$('spin');let pDrag=false,pStart=0;
function drawPbar(){
  const c=pb.getContext('2d'),dpr=window.devicePixelRatio||1,w=pb.width/dpr,h=pb.height/dpr;if(!w||!h)return;
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  c.fillStyle='#17221d';rrp(c,0,0,w,h,12);c.fill();c.strokeStyle='#2f4538';c.lineWidth=1.5;c.stroke();
  const p=isAI(turn)?0:power/100,fh=(h-8)*p;
  if(fh>0){const g=c.createLinearGradient(0,4,0,h-4);g.addColorStop(0,'#3fbf6a');g.addColorStop(.55,'#e8c15a');g.addColorStop(1,'#e2453c');
    c.save();rrp(c,4,4,w-8,h-8,9);c.clip();c.fillStyle=g;c.globalAlpha=.85;c.fillRect(4,4,w-8,fh);c.restore();}
  c.save();rrp(c,0,0,w,h,12);c.clip();
  const off=6+p*(h*.55);drawCue(c,w/2,off,w/2,off+h*1.25,cueById(save.cue),8);c.restore();
  $('pv').textContent=Math.round(p*100)+'%';
}
pb.addEventListener('pointerdown',e=>{if(!humanTurn())return;ensureAudio();pb.setPointerCapture(e.pointerId);pDrag=true;pStart=e.clientY;power=0;drawPbar();});
pb.addEventListener('pointermove',e=>{if(!pDrag)return;const h=pb.getBoundingClientRect().height;power=Math.max(0,Math.min(100,(e.clientY-pStart)/(h*.8)*100));drawPbar();});
const pEnd=e=>{if(!pDrag)return;pDrag=false;if(power>=3&&humanTurn())shoot();else{power=0;drawPbar();}};
pb.addEventListener('pointerup',pEnd);pb.addEventListener('pointercancel',()=>{pDrag=false;power=0;drawPbar();});
/* ---- falso topu ---- */
function drawSpin(){
  const c=sp.getContext('2d'),dpr=window.devicePixelRatio||1,w=sp.width/dpr;if(!w)return;
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,w);const r=w/2-2;
  const g=c.createRadialGradient(w*.4,w*.35,2,w/2,w/2,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfcabe');
  c.fillStyle=g;c.beginPath();c.arc(w/2,w/2,r,0,7);c.fill();
  c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=1;c.beginPath();c.moveTo(w/2,4);c.lineTo(w/2,w-4);c.moveTo(4,w/2);c.lineTo(w-4,w/2);c.stroke();
  c.fillStyle='#d22b2b';c.beginPath();c.arc(w/2+spinX*r*.75,w/2+spinY*r*.75,5,0,7);c.fill();
}
function setSpin(e){const r=sp.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}spinX=x;spinY=y;drawSpin();}
let sDrag=false;
sp.addEventListener('pointerdown',e=>{if(!humanTurn())return;sp.setPointerCapture(e.pointerId);sDrag=true;setSpin(e);});
sp.addEventListener('pointermove',e=>{if(sDrag)setSpin(e);});
sp.addEventListener('pointerup',()=>sDrag=false);
sp.addEventListener('dblclick',()=>{spinX=spinY=0;drawSpin();});
let quitArm=0;
$('gmenu').onclick=()=>{
  const paid=(gopt.kind==='match'||gopt.kind==='event')&&!over;
  if(paid&&Date.now()-quitArm>3000){quitArm=Date.now();setMsg('Çıkarsan maçı kaybedersin. Çıkmak için ☰ düğmesine tekrar bas.');return;}
  if(paid){save.losses++;addXp(10);persist();}
  clearTimeout(aiTimer);aiBusy=false;over=true;$('over').style.display='none';refreshCoins();show('menu');};
$('omenu').onclick=()=>{$('over').style.display='none';show('menu');};
$('again').onclick=()=>{
  const k=gopt.kind;
  if(k==='match'){if(!startRoom(gopt.room)){$('over').style.display='none';}}
  else if(k==='event'){const won=$('again').textContent.startsWith('Sonraki');$('over').style.display='none';if(won)startTourRound(gopt.round+1);else{renderEvents();show('events');}}
  else newGame();
};
addEventListener('resize',resize);

refreshCoins();show(save.pid?'menu':'login');loop();
